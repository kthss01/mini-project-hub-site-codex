<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Project Hub</title>
    <link rel="stylesheet" href="src/styles/common.css" />
    <link rel="stylesheet" href="src/styles/card-tokens.css" />
    <link rel="stylesheet" href="src/styles/card-grid.css" />
  </head>
  <body>
    <header class="page-header">
      <div class="page-header-main">
        <div>
          <h1>Mini Project Hub</h1>
          <p>프로젝트 목록을 확인하고 저장소로 이동해보세요.</p>
        </div>
      </div>
    </header>

    <main>
      <section id="projects-list-section" aria-labelledby="projects-title" class="projects-section">
        <div class="projects-title-row">
          <h2 id="projects-title">프로젝트 목록</h2>
          <div class="request-refresh-controls">
            <button id="request-update-button" class="request-update-button" type="button">
              <span id="request-update-button-spinner" class="request-update-button-spinner" aria-hidden="true"></span>
              <span id="request-update-button-label">데이터 갱신 요청</span>
            </button>
            <p id="request-update-status" class="request-update-status" aria-live="polite"></p>
            <button id="request-update-retry-button" class="request-update-retry-button" type="button" hidden>
              상태 수동 재확인
            </button>
          </div>
        </div>
        <div id="project-list" class="project-grid" role="list"></div>
      </section>

      <section id="project-detail-section" class="projects-section" hidden>
        <article class="project-detail-layout">
          <div class="project-detail-visual">
            <img id="detail-thumbnail" class="project-detail-thumbnail" alt="" />
          </div>

          <div class="project-detail-body">
            <div class="project-detail-heading">
              <h2 id="detail-title"></h2>
              <button id="detail-back-button" class="detail-back-button" type="button" aria-label="목록으로 돌아가기">←</button>
            </div>
            <p id="detail-description"></p>
            <div class="project-actions">
              <a id="detail-repo-link" class="project-action-link" target="_blank" rel="noopener noreferrer">GitHub Repository</a>
              <a
                id="detail-demo-link"
                class="project-action-link project-action-link-secondary"
                target="_blank"
                rel="noopener noreferrer"
                >GitHub Pages</a
              >
            </div>

            <section id="language-breakdown" class="detail-chart"></section>
          </div>
        </article>

        <section class="project-readme">
          <h3>README.md</h3>
          <div id="readme-content"></div>
        </section>
      </section>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
